Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#173B68">Capture face</text><text x="720" y="476" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#173B68">or tongue</text><rect x="936" y="624" width="208" height="48" rx="8" fill="#FFFFFF" stroke="#17458B" stroke-width="2"/><text x="1040" y="654" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#173B68">Review summary</text><rect x="936" y="760" width="208" height="72" rx="24" fill="#FFFFFF" stroke="#17458B" stroke-width="2"/><text x="1040" y="792" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#173B68">Save or</text><text x="1040" y="812" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#173B68">continue chatting</text></svg>