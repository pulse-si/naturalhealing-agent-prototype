<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-label="Proposed NaturalHealing AI Coach interaction flow"><title>NaturalHealing.ai — Proposed AI Coach flow</title><desc>Open the Coach, ask a question or select reports, discuss, optionally add photos, review a summary, then save or continue chatting. Proposed design, not a deployed workflow.</desc><rect width="1200" height="884" fill="#FBFFF5"/><text x="48" y="64" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#173B68">NaturalHealing.ai / Proposed AI Coach flow</text><path d="M 232 220 L 309 220" fill="none" stroke="#17458B" stroke-width="2" stroke-linecap="round"/><path d="M 320 220 L 308 225 L 308 215 Z" fill="#17458B"/><text x="276" y="204" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#607482">Start</text><path d="M 516 208 L 564 208 L 564 136 L 605 136" fill="none" stroke="#17458B" stroke-width="2" stroke-linecap="round"/><path d="M 616 136 L 604 141 L 604 131 Z" fill="#17458B"/><text x="564" y="100" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#607482">No report</text><path d="M 516 232 L 564 232 L 564 312 L 605 312" fill="none" stroke="#17458B" stroke-width="2" stroke-linecap="round"/><path d="M 616 312 L 604 317 L 604 307 Z" fill="#17458B"/><text x="564" y="352" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#607482">Use records</text><path d="M 808 136 L 872 136 L 872 208 L 925 208" fill="none" stroke="#17458B" stroke-width="2" stroke-linecap="round"/><path d="M 936 208 L 924 213 L 924 203 Z" fill="#17458B"/><text x="864" y="116" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#60748